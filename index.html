<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>leehongda.com</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      line-height: 1.8;
      background: #fafafa;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .card { background: #1c1c1e !important; border-color: #333 !important; }
    }
    .card {
      max-width: 34rem;
      margin: 2rem;
      padding: 2.5rem 2rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      text-align: center;
    }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { margin: .5rem 0; color: #666; }
    code { font-size: .875em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>準備中</h1>
    <p>このページはデプロイ確認用のプレースホルダーです。</p>
    <p><code>index.html</code> を差し替えると内容が更新されます。</p>
  </main>
</body>
</html>
