# ⚠️ このワークフローは現在「手動実行のみ」です（push では動きません）。
#
#    デプロイは deploy.sh + .githooks/pre-push による
#    「ローカルからの rsync over SSH」に移行しました。
#
#    移行した理由:
#      1. XServer の SSH には「国外アクセス制限」が既定で ON になっており、
#         海外 IP で動く GitHub Actions のランナーは接続を弾かれる。
#      2. FTP 経由は認証で 530 Login incorrect が解消していない。
#
#    FTP 方式を復活させたい場合は、下の push: ブロックを有効に戻し、
#    GitHub Secrets の FTP_PASSWORD を正しい値にしてください。

name: Deploy to Xserver (FTP / manual only)

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: # Actions タブから手動実行できるようにする

# 同じワークフローを同時に走らせない（連続 push で転送が混ざるのを防ぐ）
concurrency:
  group: deploy-xserver
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ハングしたまま課金され続けるのを防ぐ

    steps:
      - name: 1. 拉取 GitHub 最新代码
        uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # 【重要】现在仓库里还没有网站源码。
      #   静态站点（index.html / css / js）直接放在仓库根目录即可，
      #   下面的 local-dir 用的是 ./ 。
      #
      #   将来如果改成需要构建的项目（Vite / React 等），
      #   请取消注释下面两块，并把 FTP 那一步的 local-dir 改成 ./dist/
      # ------------------------------------------------------------------
      # - name: 2. 安装 Node.js
      #   uses: actions/setup-node@v7
      #   with:
      #     node-version: 22
      #     cache: npm
      #
      # - name: 3. 安装依赖并打包
      #   run: |
      #     npm ci
      #     npm run build

      - name: 2. 上传前自检（Secret 是否配置正确）
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v 未设置或为空，请到 Settings > Secrets and variables > Actions 添加"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # ---- 前后空白/换行混入检查 ----
          # 从别处复制粘贴时很容易带上不可见的换行或空格，服务器会直接返回
          # 530 Login incorrect，而错误信息完全看不出原因。这里直接拦下来。
          ws=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            val="${!v}"
            if [ "$val" != "$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then
              echo "::error::Secret $v 的前后混入了空白或换行（复制粘贴的典型问题）。请删除该 Secret 后重新输入"
              ws=1
            fi
          done
          [ "$ws" -eq 0 ] || exit 1

          # ---- 格式检查 ----
          # 注意：只输出格式判定结果，绝不输出密钥内容本身
          if [[ "$FTP_SERVER" =~ ^sv[0-9]+\.xserver\.jp$ ]]; then
            echo "OK: FTP_SERVER 是 sv<数字>.xserver.jp 格式"
          else
            echo "::warning::FTP_SERVER 不是 sv<数字>.xserver.jp 格式。XServer 的 FTP 证书只覆盖 *.xserver.jp（实测 SAN = DNS:*.xserver.jp, DNS:xserver.jp），用 xs****.xsrv.jp 这类主机名会导致 FTPS 证书校验失败。请用サーバーパネル的 sv***.xserver.jp"
          fi

          if [[ "$FTP_USERNAME" =~ ^xs[0-9]+$ ]]; then
            echo "OK: FTP_USERNAME 是主 FTP 账号（サーバーID）格式，长度 ${#FTP_USERNAME} 字符"
          elif [[ "$FTP_USERNAME" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]; then
            echo "OK: FTP_USERNAME 是子 FTP 账号格式"
          else
            echo "::warning::FTP_USERNAME 既不是 xs<数字> 也不是 xxx@domain 形式，XServer 会返回 530 登录失败"
          fi
          echo "提示：若这里全部 OK 但 FTP 步骤仍然 530，XServer 上只有两种成因（按可能性排序）："
          echo "  1) 密码错误 —— 必须用「サーバーパネル」的登录密码，不是 secure.xserver.ne.jp(XServerアカウント) 的密码。"
          echo "     验证方法：无痕窗口登录サーバーパネル，用 <サーバーID> + 该密码，能进即密码正确。"
          echo "  2) FTP制限設定 —— サーバーパネル → FTP制限設定 若设了许可 IP 白名单，"
          echo "     GitHub runner 的 IP 会被拒（官方文档明言：パスワードが一致した場合でも接続を拒否）。"
          echo "     自查：SSH 里执行 find ~ -maxdepth 3 -name '.ftpaccess' 2>/dev/null，有输出即已启用限制。"

      - name: 3. 通过 FTPS 同步到 Xserver
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # XServer 的 21 端口支持 explicit FTPS（已实测 FEAT 返回 AUTH TLS / PBSZ / PROT）。
          # 明文 ftp 会把密码暴露在网络上，所以这里用 ftps。
          # 万一握手失败，可临时改成 ftp 定位问题，但不要长期使用。
          protocol: ftps
          port: 21

          # 静态站点：上传仓库根目录。注意结尾的斜杠不能少。
          local-dir: ./

          # XServer 主 FTP 账号登录后的家目录就是 /home/<サーバーID>/，
          # 所以每个域名对应一个同名文件夹，网站根目录是 <域名>/public_html/。
          # ⚠️ 如果你用的是「子 FTP 账号」且它的起点已经是该域名的 public_html，
          #    这里要改成 ./ （请在服务器面板确认后再改）。
          server-dir: ./leehongda.com/public_html/

          # ⚠️ 绝对不要加 dangerous-clean-slate: true
          #    那会先把 server-dir 里的所有文件删光（连 exclude 的文件也删），
          #    public_html 里若有 WordPress 等其他文件会一起消失。
          #    默认行为只删除「上一次由本 Action 部署过、这次已不存在」的文件，是安全的。

          # 不要把仓库说明、Actions 配置、同步状态文件传到网站上
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            .gitignore
            .ftp-deploy-sync-state.json

          # XServer 偶尔较慢，默认 30 秒容易超时中断
          timeout: 120000
          log-level: standard
